<div id="snql-overlay"></div>
<div id="snql-modal">
    <div class="header">
        <span>SNQL</span>
        <span class="table" id="snql-table"></span>
        <div id="snql-status" class="snql-status" data-state="idle"></div>
    </div>

    <div class="snql-editor">
        <div id="snql-highlight" class="snql-highlight"></div>
        <textarea id="snql-input" class="snql-input" spellcheck="false"
            placeholder="priority = 4 AND state = 'New'"></textarea>
    </div>

    <div class="footer">
        <span class="hint">Enter = open • Shift+Enter = new tab</span>
        <div class="actions">
            <button id="snql-run" class="snql-btn primary">Run</button>
            <button id="snql-open-macros" class="snql-btn">Macros</button>
        </div>
    </div>
</div>
